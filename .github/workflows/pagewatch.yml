name: pagewatch

on:
  schedule:
    - cron: "0 2 * * 2"
  workflow_dispatch:

jobs:
  pagewatch:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Watch company pages
        run: python -m collectors.page_watch
      - name: Refresh ICP fit
        run: python -m core.fit
      - name: Ranked accounts
        run: python -m core.score
