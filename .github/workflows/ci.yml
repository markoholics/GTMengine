name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: No em or en dashes
        run: "! grep -rIP '\\x{2014}|\\x{2013}' --include='*.md' --include='*.py' --include='*.sql' --include='*.yaml' --include='*.yml' --include='*.json' --include='*.ts' . --exclude-dir=.git --exclude=CLAUDE.md --exclude=draft.py"
